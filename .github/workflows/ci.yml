name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import check
        # Catches config/env errors and broken imports with a clearer failure than a
        # collection error buried in pytest output.
        run: python -c "import app.main"

      - name: Run tests
        # Integration-marked tests need live network and real credentials, so they
        # are deselected here and run manually instead.
        run: pytest -m "not integration" --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        # next build needs these present to evaluate the auth config at build time.
        # They are throwaway values — no secret is required to prove the app compiles.
        env:
          AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
          AUTH_GITHUB_ID: ci-placeholder-id
          AUTH_GITHUB_SECRET: ci-placeholder-secret
        run: npm run build
