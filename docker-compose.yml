services:
  postgres:
    image: postgres:16-alpine
    container_name: agentcommit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentcommit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentcommit}
      POSTGRES_DB: ${POSTGRES_DB:-agentcommit}
    ports:
      # A native PostgreSQL install binds 127.0.0.1:5432 specifically, which beats
      # this container's wildcard bind on that address — the container stays healthy
      # while every client silently reaches the other server. Set POSTGRES_PORT to
      # something free (5433) and match it in DATABASE_URL when that happens.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentcommit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentcommit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
